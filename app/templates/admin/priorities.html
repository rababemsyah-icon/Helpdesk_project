{% extends "base.html" %}
{% block title %}Priorités{% endblock %}

{% block content %}
<h2>Priorités</h2>
<a href="{{ url_for('admin.create_priority') }}">+ Nouvelle priorité</a>
<ul>
    {% for priority in priorities %}
    <li>
        {{ priority.name }}
        <a href="{{ url_for('admin.delete_priority', priority_id=priority.id) }}"
           onclick="return confirm('Supprimer cette priorité ?')">Supprimer</a>
    </li>
    {% endfor %}
</ul>
<p><a href="{{ url_for('admin.dashboard') }}">Retour au tableau de bord</a></p>
{% endblock %}
