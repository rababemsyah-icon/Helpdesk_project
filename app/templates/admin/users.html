{% extends "base.html" %}
{% block title %}Utilisateurs{% endblock %}

{% block content %}
<h2>Utilisateurs</h2>
<table border="1" cellpadding="8">
    <tr>
        <th>Nom</th>
        <th>Email</th>
        <th>Rôle</th>
        <th></th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.full_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td><a href="{{ url_for('admin.change_role', user_id=user.id) }}">Modifier le rôle</a></td>
    </tr>
    {% endfor %}
</table>
<p><a href="{{ url_for('admin.dashboard') }}">Retour au tableau de bord</a></p>
{% endblock %}
