{% extends "base.html" %}
{% block title %}Catégories{% endblock %}

{% block content %}
<h2>Catégories</h2>
<a href="{{ url_for('admin.create_category') }}">+ Nouvelle catégorie</a>
<ul>
    {% for category in categories %}
    <li>
        {{ category.name }}
        <a href="{{ url_for('admin.delete_category', category_id=category.id) }}"
           onclick="return confirm('Supprimer cette catégorie ?')">Supprimer</a>
    </li>
    {% endfor %}
</ul>
<p><a href="{{ url_for('admin.dashboard') }}">Retour au tableau de bord</a></p>
{% endblock %}
