{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}
<h2>Se connecter</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>{{ form.email.label }} {{ form.email() }}</p>
    <p>{{ form.password.label }} {{ form.password() }}</p>
    <p>{{ form.submit() }}</p>
</form>
{% endblock %}
